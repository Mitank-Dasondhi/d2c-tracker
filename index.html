<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D2C Commerce Tracker</title>
<style>
/* =====================================================================
   1. DESIGN TOKENS  (the only place colours, fonts and sizes are defined)
   Light only. White page, soft pastel highlights.
   ===================================================================== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;

  /* one font for everything: titles, headings, body, buttons, charts */
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-title:22px; --fs-section:16px; --fs-body:14px; --fs-small:12.5px;

  /* neutrals */
  --bg:#ffffff; --surface:#ffffff; --soft:#f8f9fb; --text:#262b33; --muted:#6b7280; --border:#e6e8ec;

  /* highlight colours. Each has: -bg (soft background), -t (text on that background), -f (soft border), -c (dark chart colour, added below) */
  --blue-bg:#e9f2fd;   --blue-t:#2b5fae;   --blue-f:#a9c9f0;
  --orange-bg:#fdefdf; --orange-t:#a45a16; --orange-f:#f5c796;
  --green-bg:#e7f6ed;  --green-t:#237049;  --green-f:#a8dbbd;
  --yellow-bg:#fdf5d9; --yellow-t:#86680c; --yellow-f:#f3dc85;
  --purple-bg:#f1ebfb; --purple-t:#6a4aa8; --purple-f:#cbbcee;
  --red-bg:#fdecec;    --red-t:#b03a3a;    --red-f:#f2b0b0;
  --gray-bg:#f0f1f4;   --gray-t:#555b66;   --gray-f:#d3d6dc;

  /* dark chart colours: used for every bar, slice, column and legend swatch */
  --blue-c:#2f6fd0; --orange-c:#e07b1f; --green-c:#2e9a5f; --yellow-c:#d9a21b; --purple-c:#7b57c4; --red-c:#d24848; --teal-c:#1f8f9b; --pink-c:#c2468f; --gray-c:#7d8591;

  --accent:var(--blue-t); --accent-bg:var(--blue-bg);
  --radius-lg:12px; --radius-md:10px; --radius-sm:8px; --radius-pill:999px;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-body)/1.45 var(--font)}
button,input,select{font-family:var(--font);font-size:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--blue-f);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--font);color:var(--text);letter-spacing:0}
h1{font-size:var(--fs-title);margin:0 0 2px;font-weight:650}
.sub{color:var(--muted);font-size:var(--fs-small);margin-bottom:14px}
.muted{color:var(--muted)}

/* =====================================================================
   3. SWITCHER (region / market / season) AND TABS
   ===================================================================== */
.markets{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.mkt{padding:9px 18px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
.mkt:hover{background:var(--soft)}
.mkt.active{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue-f)}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin:0 0 14px;border-bottom:1px solid var(--border)}
.topbar .tabs{border-bottom:0;margin:0;flex:1 1 auto;min-width:0}
.geo{display:inline-flex;align-items:center;gap:8px;margin:0 0 6px}
.geo-l{font-size:var(--fs-small);font-weight:600;color:var(--muted);white-space:nowrap}
.geo select{width:auto;min-width:170px;max-width:60vw;border:1px solid var(--blue-f);border-radius:var(--radius-pill);background:var(--blue-bg);font-weight:600;color:var(--blue-t);padding:7px 14px;cursor:pointer}
.tabs.top .tab{font-size:15px}
.pill{display:inline-block;margin-left:8px;padding:0 8px;border-radius:var(--radius-pill);background:var(--gray-bg);color:var(--gray-t);font-size:12px;font-weight:600}
.mkt.active .pill,.tab.active .pill{background:var(--surface);color:var(--blue-t)}
.tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);white-space:nowrap;font-weight:550}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue-t);border-bottom-color:var(--blue-f)}
.tab .pill{margin-left:6px;padding:0 7px;font-size:11.5px}

/* =====================================================================
   4. SEARCH, BUTTONS, FILTER PANEL
   ===================================================================== */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text)}
.btn{padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--soft)}
.btn.on{background:var(--blue-bg);border-color:var(--blue-f);color:var(--blue-t)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:5px 12px;font-size:13px}
.filters{display:none;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:12px;margin-bottom:10px;background:var(--soft);border:1px solid var(--border);border-radius:var(--radius-lg)}
.filters.open{display:grid}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-small);color:var(--muted)}
select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13.5px;width:100%}

/* =====================================================================
   5. SUMMARY TILES  (grey = numbers only, coloured = click to filter)
   ===================================================================== */
.kpis{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.kpi-row{display:flex;flex-wrap:nowrap;gap:8px;align-items:stretch}
.kpi-row.clicks{overflow-x:auto;padding-bottom:2px}
.kpi{font:inherit;text-align:left;color:var(--text);border-radius:var(--radius-lg)}
.kpi .n{font-size:22px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.static{flex:1 1 0;min-width:140px;padding:12px 16px;background:var(--soft);border:1px solid var(--border);cursor:default}
.kpi.static .n{font-size:28px}
.kpi.click{flex:1 0 150px;padding:9px 12px 8px;cursor:pointer;border:1px solid var(--kc-f);background:var(--kc-bg)}
.kpi.click .n{color:var(--kc-t)}
.kpi.click .l{color:var(--text)}
.kpi.click::after{content:"Click to filter \203A";display:block;margin-top:3px;font-size:10.5px;color:var(--kc-t)}
.kpi.click:hover{filter:brightness(.97)}
.kpi.click.active{box-shadow:0 0 0 2px var(--kc-f)}
.kpi.click.active::after{content:"Filter on \00D7 click to clear"}
.k-Growing{--kc-bg:var(--green-bg);--kc-t:var(--green-t);--kc-f:var(--green-f)}
.k-Stable{--kc-bg:var(--yellow-bg);--kc-t:var(--yellow-t);--kc-f:var(--yellow-f)}
.k-Struggling{--kc-bg:var(--red-bg);--kc-t:var(--red-t);--kc-f:var(--red-f)}
.k-Unclear{--kc-bg:var(--gray-bg);--kc-t:var(--gray-t);--kc-f:var(--gray-f)}

/* =====================================================================
   6. STATUS LINE, CHIPS, TABLE, BADGES, ROW DETAIL
   ===================================================================== */
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:6px 0 8px;color:var(--muted);font-size:13px}
.status b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--blue-bg);color:var(--blue-t);font-size:12px;border:0}
.chip:hover{filter:brightness(.96)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:var(--fs-small);font-weight:600;color:var(--muted);background:var(--soft);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th[aria-sort="ascending"]::after{content:" \25B2";font-size:.8em}
th[aria-sort="descending"]::after{content:" \25BC";font-size:.8em}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--soft)}
tbody tr.row.open{background:var(--blue-bg)}
td.num{color:var(--muted);width:48px}
td.name{font-weight:600}
td.name a{color:var(--blue-t);text-decoration:none}
td.name a:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:550;white-space:nowrap}
.b-Growing{background:var(--green-bg);color:var(--green-t)}
.b-Stable{background:var(--yellow-bg);color:var(--yellow-t)}
.b-Struggling{background:var(--red-bg);color:var(--red-t)}
.b-Unclear{background:var(--gray-bg);color:var(--gray-t)}
tr.detail td{background:var(--soft);padding:14px 16px}
dl.d{display:grid;grid-template-columns:minmax(130px,200px) 1fr;gap:6px 16px;margin:0}
dl.d dt{color:var(--muted);font-size:var(--fs-small)}
dl.d dd{margin:0;overflow-wrap:anywhere}
.empty{padding:36px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center}

/* =====================================================================
   7. CARDS, NOTICES, PROBLEM, LOADING  (README, Sources, errors)
   ===================================================================== */
.doc{display:flex;flex-direction:column;gap:14px;max-width:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.card h2{margin:0 0 4px;font-size:var(--fs-section);font-weight:650}
.card p{margin:6px 0}
.lead{color:var(--muted)}
.fine{font-size:var(--fs-small);color:var(--muted);margin:8px 0 0}
.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 16px;margin:8px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.notice{margin:0 0 8px;padding:9px 12px;border-radius:var(--radius-md);background:var(--yellow-bg);color:var(--text);border:1px solid var(--yellow-f);font-size:13px}
.problem{margin:8px 0;padding:14px 16px;border-radius:var(--radius-lg);background:var(--red-bg);border:1px solid var(--red-f);color:var(--text);max-width:760px}
.problem h3{margin:0 0 6px;font-size:15px;font-weight:650;color:var(--red-t)}
.problem p{margin:4px 0}
.loading{padding:18px 4px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.sw{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;font-size:12px;background:var(--surface)}
.sw .three{display:flex;height:34px}
.sw .three i{flex:1}
.sw span{display:block;padding:6px 8px}
.sw span b{display:block}
.typeline{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border)}
.typeline:last-child{border-bottom:0}
.typeline small{color:var(--muted);min-width:150px;font-size:12px}

/* =====================================================================
   8. CHARTS  (plain HTML and SVG, no libraries)
   Rule 0: charts and legends always use the dark -c colours, never the light ones.
   Rule 1: a chart with one series is always blue.
   Rule 2: charts with several series use blue, orange, green, yellow, purple, red, teal, pink in that order. "Other" is always grey.
   Rule 3: status colours never change: Growing green, Stable yellow, Struggling red, Unclear grey.
   ===================================================================== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between}
.tgl{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-pill);overflow:hidden;background:var(--surface)}
.tgl button{border:0;background:transparent;color:var(--muted);padding:5px 13px;font-size:13px;font-weight:550}
.tgl button:hover{background:var(--soft)}
.tgl button.on{background:var(--blue-bg);color:var(--blue-t)}
.cbody{margin-top:10px}
.cfoot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:var(--fs-small);color:var(--muted)}
.bars.boxed,.biglist.boxed{max-height:340px;overflow:auto;padding-right:4px}
.pie{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;padding:6px 0}
.numtable{max-height:340px;overflow:auto}
.numtable.short{max-height:none}
table.plain td.r,table.plain th.r{text-align:right;font-variant-numeric:tabular-nums}
.stat{background:var(--soft);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.bars{display:flex;flex-direction:column;gap:3px}
.brow{display:grid;grid-template-columns:minmax(100px,170px) 1fr auto;gap:8px;align-items:center;padding:2px 4px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:var(--radius-sm);width:100%}
.brow.click{cursor:pointer}
.brow.click:hover{background:var(--soft)}
.bl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;background:var(--gray-bg);border-radius:7px;overflow:hidden;display:flex}
.fill{height:100%;background:var(--blue-c);border-radius:7px 0 0 7px;min-width:2px}
.bv{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.donutcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:190px}
svg.donut{width:130px;height:130px}
svg.donut circle{cursor:default}
.legend{display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:190px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend b{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:6px;overflow-x:auto}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--muted)}
.col .bar{width:100%;background:var(--blue-c);border-radius:5px 5px 0 0;min-height:2px}
.col:hover .bar{filter:brightness(.95)}
.col .cv{color:var(--text);font-weight:600;margin-bottom:2px}
.col .cl{margin-top:4px;white-space:nowrap}

/* =====================================================================
   9. HOVER INFORMATION (one tooltip style for the whole site)
   ===================================================================== */
.tip{position:fixed;z-index:50;display:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 14px rgba(38,43,51,.12);color:var(--muted);padding:7px 10px;border-radius:var(--radius-sm);font-size:var(--fs-small);pointer-events:none;max-width:280px}
.tip-h{color:var(--text);font-weight:600}

/* =====================================================================
   10. PHONES
   ===================================================================== */
@media (max-width:700px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:620px){ .two{grid-template-columns:1fr} }
@media (max-width:600px){
  .tabs.top .tab{padding:9px 9px;font-size:14px}
  .geo{width:100%}
  .geo select{flex:1;max-width:none}
  .tabs.top .pill{margin-left:4px;padding:0 6px}
  .wrap{padding:12px}
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:8px}
  dl.d{grid-template-columns:1fr;gap:0}
  dl.d dt{margin-top:8px}
}

/* =====================================================================
   11. EXTRA RULES THIS SITE NEEDS (colour variables from the block above only)
   ===================================================================== */
.k-erp{--kc-bg:var(--blue-bg);--kc-t:var(--blue-t);--kc-f:var(--blue-f)}
.k-noerp{--kc-bg:var(--gray-bg);--kc-t:var(--gray-t);--kc-f:var(--gray-f)}
.note{margin:10px 0 0;padding:10px 12px;border-radius:var(--radius-md);background:var(--yellow-bg);border:1px solid var(--yellow-f);font-size:var(--fs-small)}
.card ul{margin:6px 0;padding-left:18px}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:12px}
.gcard{border:1px solid var(--kc-f);border-radius:var(--radius-md);padding:12px 14px;background:var(--kc-bg)}
.gcard.g-Growing{--kc-bg:var(--green-bg);--kc-t:var(--green-t);--kc-f:var(--green-f)}
.gcard.g-Stable{--kc-bg:var(--yellow-bg);--kc-t:var(--yellow-t);--kc-f:var(--yellow-f)}
.gcard.g-Struggling{--kc-bg:var(--red-bg);--kc-t:var(--red-t);--kc-f:var(--red-f)}
.gcard.g-Unclear{--kc-bg:var(--gray-bg);--kc-t:var(--gray-t);--kc-f:var(--gray-f)}
.gcard .gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.gcard .gt{font-size:var(--fs-section);font-weight:700;color:var(--kc-t)}
.gcard .gn{font-size:var(--fs-small);color:var(--text)}
.gcard li{margin:3px 0}
.gcard .ex{font-size:var(--fs-small);margin-top:8px;padding-top:8px;border-top:1px dashed var(--kc-f)}
.gcard .ex b{display:block}
.gcard .ex div{margin:4px 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
.biglist{margin-top:8px;max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.biglist .it{padding:7px 10px;border-bottom:1px solid var(--border);font-size:var(--fs-small)}
.biglist .it:last-child{border-bottom:0}
table.plain{min-width:0;width:100%}
table.plain td:first-child{white-space:nowrap;font-weight:600}
td.wrapcell{min-width:260px}
.scroll{overflow-x:auto}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips2 span{padding:3px 10px;border-radius:var(--radius-pill);background:var(--gray-bg);color:var(--gray-t);font-size:var(--fs-small)}
.chips2 span b{margin-left:6px;color:var(--blue-t)}
.sublegend{display:flex;flex-wrap:wrap;gap:12px;font-size:var(--fs-small);margin:6px 0 8px}
.sublegend span{display:inline-flex;align-items:center;gap:6px}
.sublegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.track.tall{height:20px}
.seg{display:flex;align-items:center;justify-content:center;font-size:var(--fs-small);font-weight:650;overflow:hidden}
@media (max-width:600px){ .kpi.static{min-width:0;padding:10px 12px} .kpi.static .n{font-size:24px} }
svg.donut text{pointer-events:none}

</style>
</head>
<body>
<div class="wrap" id="app">
  <h1 id="page-title">D2C Commerce Tracker</h1>
  <div class="sub" id="page-sub"></div>
  <div class="loading" id="loading">Loading data…</div>
  <noscript><div class="problem"><h3>JavaScript is turned off</h3><p>This page needs JavaScript to show the data. Turn it on in your browser settings and reload.</p></div></noscript>
  <div class="problem" id="problem" hidden></div>
  <div id="notices" hidden></div>
  <div class="topbar">
    <div class="tabs top" role="tablist" id="toptabs"></div>
    <label class="geo" id="geo" hidden><span class="geo-l">Geography</span><select id="geoSel" aria-label="Choose a geography"></select></label>
  </div>
</div>
<script>

/* =====================================================================
   SETTINGS: the words and file names you may want to change later.
   Everything else on this page is read from the CSV data files.
   ===================================================================== */
const SETTINGS={
  pageTitle:'D2C Commerce Tracker',        // big title at the top of the page
  description:'A list and analysis of direct-to-consumer and e-commerce companies across {geographies}. Browse the brands by category, city and headcount, open any brand’s website, and see how each geography breaks down in Analytics.',   // short text under the title; {geographies} is filled in from the markets below
  sheetTitle:'D2C Commerce India and NA',  // name of your Google Sheet (shown in the Sources tab)
  fixesFile:'category-fixes.csv',          // optional: moves a brand to a different existing category (see README.md)
  sheetUrl:'',                             // optional link to your Google Sheet. Leave empty to keep the sheet private.
  markets:[
    { key:'india', label:'India',
      brandsFile:'data-india.csv', trendsFile:'data-india-trends.csv',
      brandsTab:'Brands', trendsTab:'Category trends (all regions)' },
    { key:'na', label:'North America',
      brandsFile:'data-north-america.csv', trendsFile:'data-north-america-trends.csv',
      brandsTab:'Brands - North America', trendsTab:'Category trends (all regions)' },
    { key:'oceania', label:'Oceania',
      brandsFile:'data-oceania.csv', trendsFile:'data-oceania-trends.csv',
      brandsTab:'Brands - Oceania', trendsTab:'Category trends (all regions)' },
    { key:'sea', label:'Southeast Asia',
      brandsFile:'data-southeast-asia.csv', trendsFile:'data-southeast-asia-trends.csv',
      brandsTab:'Brands - Southeast Asia', trendsTab:'Category trends (all regions)' },
    { key:'za', label:'South Africa',
      brandsFile:'data-south-africa.csv', trendsFile:'data-south-africa-trends.csv',

function h(tag, attrs){

  if(attrs) for(const k in attrs){ const v=attrs[k]; if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else e.setAttribute(k,v); }
  for(let i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  }
  return e;
}
function safeUrl(u){ return /^https?:\/\//i.test(u) ? u : null; }
function aLink(url,label){
  const u=safeUrl(url);
  return u ? h('a',{href:u,target:'_blank',rel:'noopener noreferrer',text:label||url,'data-tip':'Opens in a new tab'}) : document.createTextNode(label||url);
}

function donut(items,total,topText,bottomText){
  const svg=svgEl('svg',{viewBox:'0 0 120 120','class':'donut',role:'img','aria-label':topText+' '+bottomText});
  const r=44, C=2*Math.PI*r; let off=0;
  const bg=svgEl('circle',{cx:60,cy:60,r:r,fill:'none','stroke-width':20}); bg.style.stroke='var(--gray-bg)'; svg.append(bg);
  items.forEach(it=>{
    if(!it.value) return;
    const len=C*it.value/total;
    const c=svgEl('circle',{cx:60,cy:60,r:r,fill:'none','stroke-width':20,'stroke-dasharray':len+' '+(C-len),'stroke-dashoffset':-off,transform:'rotate(-90 60 60)'});
    c.style.stroke=it.color;
    c.setAttribute('data-tip',`${it.label}|${it.value} brands|${pct(it.value,total)} of ${total} brands`);
    svg.append(c); off+=len;
  });
  const t1=svgEl('text',{x:60,y:58,'text-anchor':'middle','font-size':18,'font-weight':700}); t1.style.fill='var(--text)'; t1.textContent=topText;
  const t2=svgEl('text',{x:60,y:73,'text-anchor':'middle','font-size':7.5}); t2.style.fill='var(--muted)'; t2.textContent=bottomText;
  svg.append(t1,t2);

}
function legend(items,total){
  const box=h('div',{class:'legend'});
  items.forEach(it=>{
    const sw=h('i'); sw.style.background=it.color;
    box.append(h('div',{'data-tip':`${it.label}|${it.value} brands|${pct(it.value,total)} of ${total} brands`},sw,h('span',{text:it.label}),h('b',{text:`${it.value} · ${pct(it.value,total)}`})));
  });

}
function bars(entries,total,onClick,boxed){
  const max=Math.max(1,...entries.map(e=>e[1]));
  const wrap=h('div',{class:'bars'+(boxed?' boxed':'')});
  entries.forEach(([label,val,color])=>{
    const row=h(onClick?'button':'div',{class:'brow'+(onClick?' click':''),'data-tip':`${label}|${val} brands|${pct(val,total)} of ${total} brands`});
    if(onClick){ row.type='button'; row.addEventListener('click',()=>onClick(label)); }
    const fill=h('div',{class:'fill'}); fill.style.width=(val/max*100)+'%'; if(color) fill.style.background=color;
    row.append(h('span',{class:'bl',text:label,title:label}),h('div',{class:'track'},fill),h('span',{class:'bv',text:`${val} · ${pct(val,total)}`}));
    wrap.append(row);

}

/* ---------- reading the CSV data files ---------- */
const REQUIRED_BRAND_COLS=['S.No','Brand','Category','Sub-category','Website domain','HQ city','Founded year','Short note','Headcount (approx)','Product portfolio','Sales model','ERP signals','Signal source','Growth signal','Signal reason','Signal date','Signal source URL'];
const REQUIRED_TREND_COLS=['Category','Trend','Summary','Brands in list','Source URL'];

function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);          // remove the invisible mark some programs add
  const rows=[]; let row=[], f='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else inQ=false; }
      else f+=c;
    } else if(c==='"') inQ=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function cleanTable(rows){
  const header=rows[0].map(c=>c.trim());
  const body=rows.slice(1).map(r=>header.map((_,i)=>r[i]===undefined?'':String(r[i]).trim())).filter(r=>r.some(c=>c!==''));
  return {header,body};
}
async function loadTable(file){
  let res;
  try{ res=await fetch(file,{cache:'no-store'}); }
  catch(e){ throw new Error(`The file “${file}” could not be opened.`); }
  if(!res.ok) throw new Error(`The file “${file}” was not found (error ${res.status}). Check that it is uploaded in the same place as index.html and that its name matches exactly, including capital letters.`);
  const rows=parseCsv(await res.text());
  if(!rows.length || rows.every(r=>r.every(c=>c.trim()===''))) throw new Error(`The file “${file}” is empty.`);
  const table=cleanTable(rows);
  try{ table.lastModified=(res.headers&&res.headers.get)?res.headers.get('Last-Modified'):null; }catch(e){ table.lastModified=null; }
  return table;
}
function needColumns(file,header,required){
  const missing=required.filter(c=>!header.includes(c));
  if(missing.length) throw new Error(`The file “${file}” is missing these columns: ${missing.join(', ')}. The column names in the first row must match exactly (see README.md).`);
}
async function loadMarketData(M){
  const [b,tr]=await Promise.all([loadTable(M.brandsFile),loadTable(M.trendsFile)]);
  needColumns(M.brandsFile,b.header,REQUIRED_BRAND_COLS);
  needColumns(M.trendsFile,tr.header,REQUIRED_TREND_COLS);
  const fix=['S.No','Founded year'].map(n=>b.header.indexOf(n));
  b.body.forEach(r=>fix.forEach(i=>{ r[i]=r[i].replace(/^(\d+)\.0+$/,'$1'); }));   // 2016.0 becomes 2016
  const ti=REQUIRED_TREND_COLS.map(n=>tr.header.indexOf(n));
  M.cols=b.header; M.rows=b.body;
  M.trends=tr.body.map(r=>ti.map(i=>r[i]));
  M.lastModified=[b.lastModified,tr.lastModified].filter(Boolean).map(s=>new Date(s)).filter(d=>!isNaN(d)).sort((x,y)=>y-x)[0]||null;
}
function showProblem(message,hint){
  const box=document.getElementById('problem');
  box.textContent='';
  box.append(
    h('h3',{text:'The page could not load its data'}),
    h('p',{text:message}),
    h('p',{class:'lead',text:hint||'Fix the file in your GitHub project, wait a minute, then reload this page. README.md explains each step.'})
  );
  box.hidden=false;
  document.getElementById('loading').hidden=true;
}

/* ---------- optional category fixes (category-fixes.csv) ---------- */
async function applyCategoryFixes(){
  const notes=[], file=SETTINGS.fixesFile;
  if(!file) return notes;
  let res;
  try{ res=await fetch(file,{cache:'no-store'}); }catch(e){ return notes; }
  if(!res || !res.ok) return notes;                                   // the file is optional
  let t; try{ t=cleanTable(parseCsv(await res.text())); }catch(e){ return [`The file “${file}” could not be read, so no category fixes were applied.`]; }
  const need=['Market','Brand','Category'].filter(c=>!t.header.includes(c));
  if(need.length) return [`The file “${file}” is missing the columns ${need.join(', ')}, so no category fixes were applied.`];
  const mi=t.header.indexOf('Market'), bi=t.header.indexOf('Brand'), ci=t.header.indexOf('Category');
  const moved={}, problems=[];
  t.body.forEach(f=>{
    const mk=Object.keys(MARKETS).find(k=>MARKETS[k].label.toLowerCase()===f[mi].toLowerCase()||k===f[mi].toLowerCase());
    if(!mk){ problems.push(`“${f[bi]}” (unknown market “${f[mi]}”)`); return; }
    const M=MARKETS[mk], I=n=>M.cols.indexOf(n);
    const hits=M.rows.filter(r=>r[I('Brand')].toLowerCase()===f[bi].toLowerCase());
    if(hits.length!==1){ problems.push(`“${f[bi]}” (${hits.length?'more than one match':'not found'} in ${M.label})`); return; }
    if(!M.rows.some(r=>r[I('Category')]===f[ci])){ problems.push(`“${f[bi]}” (category “${f[ci]}” does not exist in ${M.label})`); return; }
    const r=hits[0];
    if(r[I('Category')]===f[ci]) return;
    M.moved=M.moved||new Map(); if(!M.moved.has(r[I('Brand')])) M.moved.set(r[I('Brand')],r[I('Category')]);
    r[I('Category')]=f[ci]; moved[mk]=(moved[mk]||0)+1;
  });
  Object.keys(moved).forEach(k=>notes.push(`${MARKETS[k].label}: ${moved[k]} ${moved[k]===1?'brand is':'brands are'} shown under a different category than in the Google Sheet, as listed in ${file}. No brand was removed.`));
  if(problems.length) notes.push(`${file}: ${problems.length} ${problems.length===1?'line was':'lines were'} ignored: ${problems.slice(0,5).join('; ')}${problems.length>5?'…':''}.`);
  return notes;
}

const PAGE_NOTES=[];
/* ---------- start ---------- */
async function boot(){
  document.title=SETTINGS.pageTitle;
  document.getElementById('page-title').textContent=SETTINGS.pageTitle;
  const gl=SETTINGS.markets.map(m=>m.label), geoText=gl.length>1?gl.slice(0,-1).join(', ')+' and '+gl[gl.length-1]:gl.join('');
  document.getElementById('page-sub').textContent=SETTINGS.description.replace('{geographies}',geoText);
  if(location.protocol==='file:'){
    showProblem('This page cannot read its data files when it is opened by double-clicking it on your computer. Open it from its web link instead (your GitHub Pages link).','Publish the project on GitHub Pages, then open your link. README.md explains how.');
    return;
  }
  try{ await Promise.all(Object.keys(MARKETS).map(k=>loadMarketData(MARKETS[k]))); }
  catch(e){ showProblem(e.message); return; }

  const notices=await applyCategoryFixes();
  Object.keys(MARKETS).forEach(k=>{
    const M=MARKETS[k], gi=M.cols.indexOf('Growth signal'), bi=M.cols.indexOf('Brand'), ci=M.cols.indexOf('Category');
    const badGrowth=M.rows.filter(r=>!GROWTH_ORDER.includes(r[gi])).length;
    const noName=M.rows.filter(r=>r[bi]===''||r[ci]==='').length;
    if(badGrowth) notices.push(`${M.label}: ${badGrowth} ${badGrowth===1?'row has':'rows have'} a Growth signal that is not Growing, Stable, Struggling or Unclear. ${badGrowth===1?'It is':'They are'} shown as written in the sheet.`);
    if(noName) notices.push(`${M.label}: ${noName} ${noName===1?'row has':'rows have'} no Brand or no Category in the data file.`);
  });
  PAGE_NOTES.push(...notices);   // shown in the README tab, not at the top of the page

  const app=document.getElementById('app'), sel=document.getElementById('geoSel'), tabsBox=document.getElementById('toptabs');
  VIEWS.forEach(([v,l])=>{
    const t=h('button',{class:'tab',role:'tab','data-view':v},l,v==='brands'?h('span',{class:'pill',id:'toppill'}):null);
    t.addEventListener('click',()=>{ showMarket(curKey,v,true); window.scrollTo(0,0); });
    tabsBox.append(t);
  });
  const keys=Object.keys(MARKETS);
  keys.forEach(k=>{
    const M=MARKETS[k];
    sel.append(h('option',{value:k,text:`${M.label} (${M.rows.length})`}));
    app.append(h('div',{id:'market-'+k,hidden:''}));
    instances[k]=createMarket(M);
  });
  sel.addEventListener('change',e=>showMarket(e.target.value,undefined,true));
  document.getElementById('geo').hidden=false;
  document.getElementById('loading').hidden=true;
  window.addEventListener('hashchange',routeFromHash);
  routeFromHash();
}
/* ===== hover information ===== */
const tipBox = document.createElement('div');
tipBox.className = 'tip'; tipBox.id = 'tip'; tipBox.setAttribute('role', 'tooltip');
document.body.append(tipBox);
function showTip(el, x, y) {
  const raw = el.getAttribute('data-tip');
  if (!raw) return hideTip();
  tipBox.replaceChildren();
  raw.split('|').filter(Boolean).forEach((p, i) => {
    const d = document.createElement('div');
    if (!i) d.className = 'tip-h';
    d.textContent = p;
    tipBox.append(d);
  });
  tipBox.style.display = 'block';
  const w = tipBox.offsetWidth, hh = tipBox.offsetHeight;
  tipBox.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tipBox.style.top = (y + 18 + hh > window.innerHeight ? Math.max(8, y - hh - 12) : y + 18) + 'px';
}
function hideTip() { tipBox.style.display = 'none'; }
document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('mouseleave', hideTip);
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 12); } });
document.addEventListener('focusout', hideTip);
window.addEventListener('scroll', hideTip, true);

boot();

</script>
